<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>怃楉の小站</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .card {
      text-align: center;
      padding: 48px 40px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 520px;
      width: 90%;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2.2em;
      letter-spacing: 2px;
    }
    .sub {
      margin: 0 0 28px;
      opacity: 0.85;
      font-size: 1.05em;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: #fff;
      color: #667eea;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.15s;
    }
    .btn:hover {
      transform: scale(1.05);
    }
    .foot {
      margin-top: 30px;
      font-size: 0.85em;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>怃楉の小站</h1>
    <p class="sub">你好呀，这里是我的第一个 GitHub 主页 🎉</p>
    <a class="btn" href="https://github.com/ruo-wu">去我的 GitHub 看看 →</a>
    <div class="foot">Made with ❤️ by 怃楉</div>
  </div>
</body>
</html>
